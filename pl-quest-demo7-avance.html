'use strict';

// Turns the rows of one unit (see the header of any hotel.es.js...) into the dictionary entries the game reads:
// year.<id>.<unit>.title, .scene, .brief, .facts and, for each answer (smart, temp, plac, ign), .name, .desc and .why.

const ANSWERS = Object.freeze(['smart', 'temp', 'plac', 'ign']);
const ANSWER_PARTS = Object.freeze(['name', 'desc', 'why']);
const ROW_LENGTH = 5 + ANSWERS.length;

function entriesOf(unit, row) {
  if (!Array.isArray(row) || row.length !== ROW_LENGTH) throw new Error(`${unit}: a row has ${ROW_LENGTH} parts, got ${Array.isArray(row) ? row.length : typeof row}`);
  const [id, title, scene, brief, facts, ...answers] = row;
  const key = (field) => `year.${id}.${unit}.${field}`;
  answers.forEach((answer, i) => {
    if (!Array.isArray(answer) || answer.length !== ANSWER_PARTS.length) throw new Error(`${unit} ${id}: the ${ANSWERS[i]} answer needs ${ANSWER_PARTS.join(', ')}`);
  });
  return [
    [key('title'), title],
    [key('scene'), scene],
    [key('brief'), brief],
    [key('facts'), facts],
    ...answers.flatMap((answer, i) => answer.map((text, part) => [key(`${ANSWERS[i]}.${ANSWER_PARTS[part]}`), text])),
  ];
}

function casesOf(unit, rows) {
  const entries = rows.flatMap((row) => entriesOf(unit, row));
  const keys = entries.map(([key]) => key);
  if (new Set(keys).size !== keys.length) throw new Error(`${unit}: a problem is written twice`);
  return Object.freeze(Object.fromEntries(entries));
}

module.exports = { casesOf, ANSWERS };

    ['Priorizar pedidos', 'Priorizas lo crítico con el stock que queda y compras la bomba a un local.', 'Equilibrada: priorizaste lo crítico de las plantas de alimentos y compraste la bomba sin pagar de más.'],
    ['Parche provisorio', 'Reparas la bomba de forma provisoria por 2 días y sigues a plena carga.', 'Atajo: el parche sostuvo la carga 2 días; si vuelve a fallar, la sanitización queda al aire.'],
    ['Comprar urgente', 'Compras la bomba y la materia prima en 24 horas a cualquier precio.', 'Cesión: compraste bomba y materia prima en 24 horas a cualquier precio: plantas servidas, al costo más alto.'],
    ['Detener la línea', 'Paras la línea 2 y aguardas los repuestos del proveedor.', 'Pasividad: paraste a esperar repuestos: plantas sin sanitizante y costos de planta detenida.']],
  ['m03s', 'Producto de agua', 'Oportunidad: un programa de ahorro de agua que 5 plantas preguntaron.', 'Cinco plantas de alimentos preguntaron por un programa que reduce el agua de sus lavados y enjuagues. Es un servicio nuevo: hay demanda, pero nadie lo ha probado en una planta de tu cartera.', 'Cliente: plantas de alimentos|Plantas interesadas: 5|Servicio: nuevo, sin pilotos',
    ['Piloto acotado', 'Lo pruebas 3 meses en un cliente amigo y mides el efecto antes de escalar.', 'Equilibrada: el piloto de 3 meses con un cliente amigo cuesta servicio hoy y deja un resultado medido para escalar.'],
    ['Lanzar a todos', 'Lo ofreces ya a las 5 plantas, con resultados que prometes lograr.', 'Atajo: vendiste a las 5 plantas prometiendo resultados: ventas hoy, reclamos si no se cumplen.'],
    ['Armar propuesta', 'Preparas una propuesta con presupuesto y partes cuando la aprueben.', 'Cesión: armaste la propuesta y esperas aprobación; el gasto comercial corre y las ventas aún no.'],
    ['Otra oportunidad', 'Priorizas los 4 proyectos del año y el programa queda para otra oportunidad.', 'Pasividad: dejaste el programa para otra oportunidad y las 5 plantas preguntaron a otro proveedor.']],
  ['m04c', 'Recorte de presupuesto', 'Un cliente recorta 10% su presupuesto de insumos y pide bajar los precios.', 'Una planta de alimentos recorta 10% su presupuesto de insumos porque su cadena de retail le exige bajar precios, y pide lo mismo a ti. Tiene otros proveedores y decide en 30 días.', 'Cliente: planta de alimentos|Peso: 10% de tus ventas|Presupuesto del cliente: -10%',
    ['Recortar su dosis', 'Ajustas la dosis para que la planta gaste 10% menos y cobras un servicio.', 'Equilibrada: la planta gasta menos y paga un servicio por el ahorro; se queda y tu margen se cuida.'],
    ['Cambiar el mix', 'Rebajas 5% el sanitizante principal y subes 5% los servicios del contrato.', 'Atajo: bajaste el sanitizante y subiste servicios; el trato cierra, pero la planta verá el recargo.'],
    ['Rebajar el contrato', 'Rebajas 5% por 12 meses el precio del contrato, y la planta se queda.', 'Cesión: rebajaste 5% por 12 meses y la planta se quedó; ese descuento lo pagas todo el año.'],
    ['Sostener términos', 'Mantienes los términos vigentes y la planta decide en 30 días si se queda.', 'Pasividad: mantuviste los términos y en 30 días la planta pasó parte de su volumen a otro proveedor.']],
  ['m04p', 'Rotación de operadores', 'Se van 2 de 9 operadores y los turnos de sanitizantes quedan incompletos.', 'Dos de tus 9 operadores de la línea de sanitizantes renunciaron para irse a la competencia y los turnos quedan incompletos. Reemplazarlos exige semanas de práctica con normas de inocuidad.', 'Cliente: plantas de alimentos|Operadores que se van: 2 de 9|Reemplazo: 6 semanas de práctica',
    ['Plan de relevo', 'Formas a dos jóvenes en 6 semanas de práctica y reorganizas los turnos.', 'Equilibrada: capacitaste a dos reemplazos y reordenaste turnos: cuesta hoy y acaba las horas extra.'],
    ['Horas extra', 'Pides al equipo actual doble turno durante un trimestre.', 'Atajo: los turnos dobles sostienen la línea un trimestre; el equipo se desgasta y otros pueden irse.'],
    ['Subir sueldos', 'Subes 8% el sueldo de los operadores de la línea y nadie más se va.', 'Cesión: el alza de 8% frenó las renuncias en sanitizantes, pero la mano de obra cuesta más para siempre.'],
    ['Cupos vacantes', 'Repartes tareas durante el trimestre y los 2 cupos quedan vacíos.', 'Pasividad: dejaste los cupos vacantes: bajó la nómina, pero la línea y la inocuidad se resintieron.']],
  ['m05c', 'Visitas sin costo', 'Una planta de alimentos (9% de ventas) pide visitas semanales sin pagar más.', 'Una planta de alimentos pide una visita técnica semanal para validar la limpieza de sus líneas, sin pagar más. Cada visita cuesta horas de tu equipo y otras plantas podrían pedir lo mismo.', 'Cliente: planta de alimentos|Peso: 9% de tus ventas|Visitas pedidas: 4 por mes',
    ['Visitas por dato', 'Instalas monitoreo remoto de la limpieza y visitas solo si el dato lo pide.', 'Equilibrada: el monitoreo evita visitas de más: planta validada y menos Direct Chg.'],
    ['Técnico auxiliar', 'Aceptas las visitas semanales con un auxiliar y reduces el gasto 40%.', 'Atajo: un auxiliar cuesta 40% menos, pero en una planta de alimentos una limpieza mal validada pega después.'],
    ['Visitas semanales', 'Concedes 4 visitas por mes por cuenta tuya y cubres el costo del servicio.', 'Cesión: 4 visitas por mes a tu cuenta: la planta queda contenta, y los Direct Chg suben sin ingreso a cambio.'],
    ['Pasar a Operaciones', 'Pasas el caso a Operaciones y ofreces respuesta con fecha en 20 días.', 'Pasividad: tardaste 20 días en responder y la planta sintió que su limpieza no te importaba.']],
  ['m05p', 'Incidente de seguridad', 'Hay un incidente sin heridos en la planta y en 10 días llega una auditoría.', 'Hay una fuga de producto en tu planta de sanitizantes: sin heridos, pero el procedimiento falló. En 10 días llega la auditoría de seguridad de un cliente de alimentos.', 'Cliente: industria de alimentos|Auditoría: en 10 días|Pedidos en curso: 120',
    ['Investigar causa', 'Detienes la zona 2 días con el equipo y corriges el procedimiento.', 'Equilibrada: paraste la zona 2 días y corregiste el procedimiento; la auditoría te encuentra al día.'],
    ['Cerrar el informe', 'Cierras el informe como incidente menor, por los 7 días que costaría parar.', 'Línea roja: cerraste como menor un incidente real. Ocultarlo es grave: sanción y auditoría en contra.'],
    ['Parar la planta', 'Detienes la planta 7 días y rehaces los procedimientos de cero.', 'Cesión: paraste 7 días y rehiciste todo: seguridad impecable, pero con pedidos atrasados y costo alto.'],
    ['Producir igual', 'Continúas produciendo para cumplir 120 pedidos, pues nadie resultó herido.', 'Pasividad: seguiste produciendo sin investigar: la auditoría encuentra el procedimiento roto.']],
  ['m06c', 'Competidor 8% menor', 'Un competidor ofrece 8% menos y amenaza un contrato de 14% de ventas.', 'Un competidor ofrece 8% menos a un grupo de alimentos que pesa 14% de tus ventas. Su jefe de calidad valora tu servicio, pero compras presiona por bajar el costo de los insumos.', 'Cliente: grupo de alimentos|Peso: 14% de tus ventas|Oferta rival: 8% menos',
    ['Mostrar el ahorro', 'Traes el ahorro medido y defiendes el precio con un rebate durante 2 años.', 'Equilibrada: mostraste el ahorro medido en limpieza y defendiste el precio con un rebate a 2 años.'],
    ['Amarrar al grupo', 'Firmas 3 años con multas de salida de 20% y mantienes el precio de lista.', 'Atajo: el contrato de 3 años con multas retiene al grupo hoy, pero resentido y atado.'],
    ['Igualar el precio', 'Bajas 8% el precio mientras dure el contrato y conservas el resto.', 'Cesión: igualaste el 8% menos todo el contrato: conservas al grupo y el margen cae cada mes.'],
    ['Confiar en el lazo', 'Cuidas la relación y das por seguro el apoyo de su equipo por 3 años.', 'Pasividad: diste por segura su lealtad y el grupo movió parte del contrato al competidor.']],
  ['m06e', 'Norma de agua', 'Una norma ambiental limita 20% el uso de agua en las plantas de alimentos.', 'Una norma ambiental obliga a las plantas de alimentos a usar 20% menos agua. Tus clientes necesitan soluciones ya y todos los competidores están ofreciendo programas.', 'Cliente: plantas de alimentos|Recorte de agua exigido: 20%|Plazo para cumplir: 6 meses',
    ['Programa de reuso', 'Propones un programa de reuso de agua con pago por m3 ahorrado.', 'Equilibrada: el programa de reuso con pago por m3 ahorrado alinea tu ingreso con el ahorro del cliente.'],
    ['Paquete cerrado', 'Vendes un paquete llave en mano aún no probado y firmas 3 contratos.', 'Atajo: vendiste un paquete sin probar y firmaste 3 contratos; si falla, el reclamo es tuyo.'],
    ['Diagnóstico gratis', 'Haces diagnósticos de ahorro gratis a los clientes para ganarte su confianza.', 'Cesión: los diagnósticos gratis ganan confianza, pero el servicio sin cobrar suma Direct Chg sin ventas.'],
    ['Que pidan ayuda', 'Ayudas solo a quien lo pide, con una respuesta en 10 días.', 'Pasividad: ayudaste solo a quien pidió y en 10 días varios clientes ya habían contratado a otro.']],
  ['m06p', 'Deriva de calidad', 'Esta semana 4 de 10 lotes de sanitizante salen al límite de la especificación.', 'Esta semana 4 de 10 lotes de sanitizante salen al límite de la especificación. Las plantas de alimentos exigen certificado de calidad por lote y un lote dudoso puede costar una auditoría.', 'Cliente: plantas de alimentos|Lotes al límite: 4 de 10|Certificado: por cada lote',
    ['Ajustar el proceso', 'Ajustas el proceso con calidad y refuerzas el control por lote.', 'Equilibrada: ajustaste el proceso y reforzaste controles: lotes en rango y certificados reales para alimentos.'],
    ['Mezclar los lotes', 'Mezclas lotes dudosos con lotes buenos para que el promedio cumpla.', 'Línea roja: mezclaste sanitizante dudoso con bueno para certificar. Es fraude de calidad: retiro y sanción.'],
    ['Controles extra', 'Analizas cada lote dos veces y la liberación se demora 2 días.', 'Cesión: sumaste pruebas a cada lote y la liberación tarda 2 días más: calidad firme, con costo y atrasos.'],
    ['Esperar un reclamo', 'Despachas los 4 lotes y archivas las pruebas hasta que alguna planta reclame.', 'Pasividad: despachaste los 4 lotes sin reforzar nada: cuando una planta de alimentos reclame, será por escrito.']],
  ['m07c', 'Auditoría de costos', 'Un cliente (11% de tus ventas) pide auditar tus costos y tu margen.', 'Un grupo de alimentos que pesa 11% de tus ventas pide auditar tus costos y tu margen antes de renovar. Su jefe de compras sospecha que el flete y el servicio de limpieza vienen inflados.', 'Cliente: grupo de alimentos|Peso: 11% de tus ventas|Pedido: auditar costos y margen',
    ['Abrir con reglas', 'Auditas con reglas: muestras flete y Direct Chg y defines cómo comparar.', 'Equilibrada: abriste flete y Direct Chg con reglas claras; el grupo ve el valor y no pide más rebaja.'],
    ['Mostrar a medias', 'Muestras los costos que te favorecen y dejas el resto en resumen.', 'Atajo: mostraste solo los costos que te favorecen; si el grupo cruza datos, pierdes su confianza.'],
    ['Libro abierto', 'Pones todos los costos sobre la mesa y cedes 2 puntos de margen.', 'Cesión: abriste todo y aceptaste bajar 2 puntos de margen sin discutir el valor de tu servicio en planta.'],
    ['Auditoría después', 'Propones postergar la auditoría 6 meses, por la campaña de producción.', 'Pasividad: postergaste la auditoría 6 meses y el grupo asumió que escondías algo: compró menos.']],
  ['m07p', 'Proveedor atrasado', 'Tu único proveedor se atrasa 3 semanas con un insumo que pesa 30% del costo.', 'Tu único proveedor de un insumo que pesa 30% del costo avisa un atraso de 3 semanas. Una planta de alimentos espera tus pedidos y no acepta entregas incompletas.', 'Insumo: 30% del costo|Atraso: 3 semanas|Proveedores calificados: 1',
    ['Segundo proveedor', 'Calificas un segundo proveedor con 2 pruebas y cubres el hueco con stock.', 'Equilibrada: calificaste un segundo proveedor y cubriste el hueco con stock: dependes menos de uno solo.'],
    ['Insumo alternativo', 'Cambias a un insumo más barato por 3 meses y lo informas después.', 'Atajo: el insumo más barato salva el trimestre; en alimentos, cambiar sin avisar abre un reclamo.'],
    ['Flete urgente', 'Traes el insumo en avión a cualquier tarifa y evitas la espera.', 'Cesión: el avión salvó la fecha a cualquier tarifa y el flete se comió el margen de esos pedidos.'],
    ['Plan único', 'Conservas al proveedor único y confías en recuperar el atraso solo.', 'Pasividad: confiaste en el proveedor único y la planta paró 3 semanas: los pedidos no salieron.']],
  ['m08c', 'Nuevo comprador', 'El nuevo jefe de compras de un cliente (16% de ventas) quiere licitar.', 'El nuevo jefe de compras de un grupo de alimentos (16% de tus ventas) quiere licitar todo el suministro. Llegó con la meta de bajar costos y no conoce tu historial.', 'Cliente: grupo de alimentos|Peso: 16% de tus ventas|Proceso: licitación abierta',
    ['Reunión de valor', 'Traes resultados medidos y planteas un rebate escalonado durante 2 años.', 'Equilibrada: llevaste resultados medidos de inocuidad y un rebate escalonado a 2 años: el jefe ve valor.'],
    ['Precio base bajo', 'Entras con un precio base 6% menor y cobras aparte limpieza y auditorías.', 'Atajo: entraste con 6% menos de precio base y cobraste aparte las auditorías; la factura sorprende.'],
    ['Licitar al mínimo', 'Ofreces el precio más bajo posible a todas las plantas por 3 años.', 'Cesión: ofreciste el precio más bajo por 3 años: ganas el grupo con margen mínimo.'],
    ['Invitación formal', 'Recibes la invitación formal y ofreces cotizar en 10 días con tu precio de hoy.', 'Pasividad: esperaste la invitación formal y cotizaste en 10 días; el jefe ya manejaba otros precios.']],
  ['m08e', 'Sube el dólar', 'El dólar sube 10% y tu costo de insumos importados también.', 'El dólar sube 10% y tus insumos importados se encarecen igual. Las plantas de alimentos te compran con listas de precio que se revisan cada 3 meses.', 'Cliente: plantas de alimentos|Dólar: +10%|Revisión de precios: cada 3 meses',
    ['Traspaso gradual', 'Subes por etapas la mitad del alza en los precios con aviso de 30 días.', 'Equilibrada: traspasaste la mitad del alza por etapas, con aviso de 30 días; los clientes lo aceptan.'],
    ['Alza inmediata', 'Reajustas los precios 10% de una vez y compensas el alza del mes.', 'Atajo: reajustaste 10% de una vez: el mes mejora, pero varios clientes empiezan a cotizar afuera.'],
    ['Absorber el alza', 'Dejas los precios igual para cuidar a los clientes y el margen paga 10%.', 'Cesión: dejaste los precios igual para cuidar a los clientes y el margen pagó el 10% completo.'],
    ['Mirar el dólar', 'Usas la lista de precios actual y evalúas el dólar cada 30 días.', 'Pasividad: miraste el dólar cada 30 días con la lista vieja: el costo subió y el margen se erosionó.']],
  ['m08p', 'Capacidad al límite', 'La demanda supera 12% la capacidad de la planta por 3 meses.', 'En plena campaña, las plantas de alimentos piden 12% más de lo que tu planta puede producir durante 3 meses. Producir más cuesta; rechazar pedidos también.', 'Cliente: alimentos en campaña|Demanda sobre capacidad: +12%|Duración: 3 meses',
    ['Turno adicional', 'Sumas un turno extra planificado y despachas primero lo de mayor margen.', 'Equilibrada: sumaste un turno planificado y cuidaste vencimiento y margen: la planta rinde sin romperse.'],
    ['Planta sin pausa', 'Corres la línea 24 horas durante la campaña y postergas las mantenciones.', 'Atajo: la planta sin pausa cubre la campaña, pero aplazar mantenciones puede salir muy caro después.'],
    ['Tomar los pedidos', 'Tomas todos los pedidos de la campaña y negocias los plazos después.', 'Cesión: tomaste toda la campaña y negociaste plazos después; atrasos y horas extra suben el costo.'],
    ['Mantener la rutina', 'Dejas el plan como está y confías en que la demanda se acomode.', 'Pasividad: seguiste con el plan vigente y la demanda no se ordenó sola: se perdieron pedidos de campaña.']],
  ['m09c', 'Volumen por precio', 'Un grupo de alimentos (13% de ventas) promete 20% más volumen si le bajas 5%.', 'Un grupo de alimentos que pesa 13% de tus ventas promete 20% más volumen si le bajas 5%. Abre una línea nueva, pero la promesa no está firmada y su margen ya es bajo.', 'Cliente: grupo de alimentos|Volumen prometido: +20%|Rebaja pedida: 5%',
    ['Descuento por tramo', 'Rebajas 5% solo en el volumen nuevo y revisas el resultado a los 3 meses.', 'Equilibrada: rebajaste 5% solo al volumen nuevo y revisaste a los 3 meses: más ventas, margen cuidado.'],
    ['Subir al resto', 'Subes 3% la lista a las plantas chicas, que no negocian, y costeas la rebaja.', 'Atajo: subiste 3% a las plantas chicas, que no negocian: hoy sube el OI, mañana lo notan.'],
    ['Dar el 5% a todo', 'Concedes 5% de descuento por todo el año y confías en que la línea nueva venderá.', 'Cesión: diste 5% por todo el año confiando en la línea nueva: más ventas, con un margen mucho menor.'],
    ['Pasar al comité', 'Envías la propuesta al comité de precios del grupo, que se reúne en 4 semanas.', 'Pasividad: dejaste la propuesta 4 semanas en el comité y el grupo repartió su volumen.']],
  ['m09s', 'Contrato del proveedor', 'Tu proveedor clave (32% del costo) ofrece 6% menos por 3 años de contrato.', 'Tu proveedor clave (32% del costo) ofrece 6% menos si firmas por 3 años. Para una planta de alimentos el insumo es crítico, pero atarte tanto tiempo también tiene riesgos.', 'Insumo: 32% del costo|Descuento ofrecido: 6%|Contrato: 3 años',
    ['Contrato con salida', 'Firmas 36 meses con una cláusula de salida al mes 18 y precio indexado.', 'Equilibrada: firmaste 36 meses con salida al mes 18 y precio indexado: el costo baja y conservas opciones.'],
    ['Exclusividad total', 'Aceptas 5 años de exclusividad y consigues 9% menos de inmediato.', 'Atajo: aceptaste 5 años de exclusividad por 9% menos: el costo baja hoy y te quedas sin alternativa.'],
    ['Firmar sin cambios', 'Apruebas el texto del proveedor tal como llegó, con alzas anuales.', 'Cesión: firmaste el texto del proveedor tal cual, con alzas anuales: el ahorro se come con los reajustes.'],
    ['Dejarlo caducar', 'Sigues comprando a precio de lista y la oferta caduca en 30 días.', 'Pasividad: dejaste caducar la oferta y seguiste a precio de lista: el 6% de ahorro se perdió.']],
  ['m10c', 'Equipos en comodato', 'Un cliente pide 3 dosificadores en comodato para sus plantas nuevas.', 'Una planta de alimentos pide 3 dosificadores en comodato para sus líneas nuevas. Los equipos son tuyos y su mantención corre por tu cuenta, aunque compre poco.', 'Equipos pedidos: 3 dosificadores|Compra mínima: sin acordar|Mantención: por tu cuenta',
    ['Comodato con mínimo', 'Entregas los equipos si compra un mínimo anual y paga el mantenimiento.', 'Equilibrada: entregaste los equipos con compra mínima anual y mantención pagada: instalas con retorno claro.'],
    ['Subir el precio', 'Recargas 3% al precio de los insumos y costeas los equipos con eso.', 'Atajo: recargaste 3% al precio de los insumos para costear los equipos; el cliente verá el alza en su factura.'],
    ['Entregar sin trabas', 'Entregas los 3 equipos y asumes la mantención, aunque compre poco.', 'Cesión: entregaste los 3 equipos y asumiste la mantención aunque compre poco: Direct Chg sin ventas.'],
    ['Que los compre', 'Explicas que el comodato no existe y que compre sus propios equipos.', 'Pasividad: le dijiste que comprara sus propios equipos; el cliente se fue con quien sí los presta.']],
  ['m10e', 'Sequía en la planta', 'Una sequía recorta 20% el agua de tu planta y no cubre todos los pedidos.', 'Una sequía recorta 20% el agua que usa tu planta y no alcanza para todos los pedidos. Las plantas de alimentos esperan sus entregas y no todos los pedidos rinden igual.', 'Agua disponible: 20% menos|Pedidos sin cubrir: 1 de 4|Cliente: plantas de alimentos',
    ['Pedidos rentables', 'Asignas el volumen a los pedidos que más rinden y avisas al resto.', 'Equilibrada: asignaste el agua a los pedidos que más rinden y avisaste al resto: menos volumen, más margen.'],
    ['Recargo por escasez', 'Impones un recargo de 10% por escasez, incluso a pedidos ya cotizados.', 'Atajo: el recargo de 10% sube el ingreso hoy, pero lo cobraste también a pedidos ya cotizados.'],
    ['Camiones aljibe', 'Contratas camiones aljibe para abastecer a todos, cueste lo que cueste.', 'Cesión: los camiones aljibe abastecieron a todos: ninguna venta se perdió y el costo del agua se disparó.'],
    ['Orden de llegada', 'Operas con el agua disponible y entregas los pedidos según lleguen.', 'Pasividad: entregaste por orden de llegada: se cubrieron pedidos de poco margen y se perdieron los mejores.']],
  ['m11c', 'Cargos en disputa', 'Un grupo objeta 3% de cargos en 4 facturas, pero sigue comprando.', 'Un grupo de alimentos objeta 3% de cargos en 4 facturas de limpieza, pero sigue comprando. Cada cargo discutido es plata en suspenso y la discusión puede desgastar la relación.', 'Cargos en disputa: 3%|Facturas objetadas: 4|Cliente: grupo de alimentos',
    ['Revisar cada cargo', 'Revisas las 4 facturas con el grupo y arreglas únicamente lo que esté mal.', 'Equilibrada: revisaste las 4 facturas con el grupo y corregiste solo lo que estaba mal: se paga lo justo.'],
    ['Cargos al precio', 'Repartes esos cargos dentro del precio de lista de las próximas facturas.', 'Atajo: repartiste esos cargos en el precio de lista de las próximas facturas; el grupo lo verá después.'],
    ['Nota de crédito', 'Abonas el 3% de las 4 facturas con notas de crédito y das por cerrado el asunto.', 'Cesión: abonaste el 3% de las 4 facturas con notas de crédito: se cierra el tema y el margen cede.'],
    ['Dejar abierta', 'Sigues con la disputa abierta y respondes si el jefe de compras insiste.', 'Pasividad: dejaste la disputa abierta; el grupo retuvo pagos y terminó exigiendo un crédito mayor.']],
  ['m12c', 'Contrato a precio fijo', 'Un cliente ofrece renovar 3 años a precio fijo, sin reajuste por inflación.', 'Una planta de alimentos grande y fiel ofrece renovar 3 años, pero a precio fijo y sin reajuste por inflación. Tus costos de insumos pueden subir; el precio no se mueve.', 'Contrato: 36 meses|Precio: fijo, sin reajuste|Peso del cliente: 12% de tus ventas',
    ['Fijo con tope', 'Aceptas 36 meses y pides un tope de variación atado al costo de insumos.', 'Equilibrada: aceptaste 36 meses con un tope atado al costo de insumos: ventas y margen cuidados.'],
    ['Alza y firma', 'Firmas con un precio inicial 3% más alto, aunque quede sobre el mercado.', 'Atajo: firmaste con un precio inicial 3% más alto que el mercado; el cliente puede irse apenas pueda.'],
    ['Firmar como piden', 'Firmas los 3 años tal como los redactó el cliente, con su propio texto.', 'Cesión: firmaste los 3 años como los redactó el cliente: ventas aseguradas, costos libres de subir.'],

    ['Aceptar el 8%', 'Aceptas con gusto la meta de +8% y la repartes entre los equipos.', 'Cesión: aceptaste el +8% y lo repartiste; la presión sube el gasto de venta y bajan los medidores.'],
    ['Enviarlo después', 'Envías el pronóstico por correo en 7 días, con las cifras del mes pasado.', 'Pasividad: enviaste el pronóstico tarde, con cifras viejas; corporativo asignó recursos sin ti.']],
  ['m03c', 'Lote fuera de norma', 'Un cliente reclama 40 toneladas que salieron fuera de especificación.', 'Una planta industrial reclama 40 toneladas de producto fuera de especificación, que detuvieron una de sus líneas por un día. Su gerente de planta pide una respuesta hoy.', 'Cliente: planta industrial|Lote reclamado: 40 toneladas|Respuesta pedida: hoy',
    ['Reponer el lote', 'Repones hoy las 40 toneladas y compartes el análisis para evitar otro reclamo.', 'Equilibrada: repusiste las 40 toneladas y compartiste el análisis: cuesta, pero evitas otro reclamo.'],
    ['Apuntar al flete', 'Atribuyes el daño al transporte y respondes con media reposición.', 'Atajo: culpar al transporte y reponer a medias ahorra hoy; si lo desmienten, pierdes su confianza.'],
    ['Descuento de 10%', 'Reconoces 10% sobre la siguiente compra del cliente y cierras el reclamo hoy.', 'Cesión: el descuento de 10% cerró el reclamo en el día, pero regalaste margen sin corregir la causa.'],
    ['Reclamo formal', 'Contestas el reclamo formal cuando llega, en 15 días, y revisas el lote.', 'Pasividad: respondiste en 15 días y el reclamo formal sumó costos de gestión y un cliente molesto.']],
  ['m03p', 'Falla y materia prima', 'Falla una bomba de la línea 2 y la materia prima rinde 5 días.', 'Falla una bomba de la línea 2 y solo quedan 5 días de una materia prima clave. Los pedidos más críticos son de plantas con calderas que no pueden quedarse sin tratamiento.', 'Cliente: plantas con calderas|Materia prima: 5 días|Línea 2: detenida',
    ['Priorizar pedidos', 'Das prioridad a las calderas con lo que queda y compras la bomba a un local.', 'Equilibrada: priorizaste las calderas críticas con lo que quedaba y compraste la bomba sin pagar de más.'],
    ['Parche provisorio', 'Arreglas la bomba por 2 días de forma provisoria y no bajas la carga.', 'Atajo: el parche te mantuvo a carga plena 2 días; si vuelve a fallar, la línea se detiene en el peor momento.'],
    ['Comprar urgente', 'Compras bomba y materia prima en 24 horas sin discutir el valor.', 'Cesión: compraste bomba y materia prima en 24 horas a cualquier precio: tratamiento al costo más alto.'],
    ['Detener la línea', 'Paras la línea 2 hoy a esperar los repuestos del proveedor.', 'Pasividad: paraste la línea a esperar repuestos: calderas sin tratamiento y costos de planta detenida.']],
  ['m04c', 'Recorte de presupuesto', 'Un cliente recorta 10% su presupuesto de insumos y pide bajar los precios.', 'Una planta industrial recorta 10% su presupuesto de insumos porque su producción cayó, y pide bajar los precios. Tiene otros proveedores a mano y su gerencia decide en 30 días.', 'Cliente: planta industrial|Peso: 10% de tus ventas|Presupuesto del cliente: -10%',
    ['Optimizar su dosis', 'Ajustas la dosis para que gaste 10% menos y cobras un servicio de agua.', 'Equilibrada: la planta baja su gasto en agua y paga un servicio por el ahorro; se queda y tu margen resiste.'],
    ['Cambiar el mix', 'Rebajas 5% el químico principal y subes 5% los servicios del contrato.', 'Atajo: bajaste el químico y subiste los servicios; el trato cierra, pero la planta verá el recargo.'],
    ['Rebajar el precio', 'Rebajas 5% por 12 meses el precio del contrato, y la planta sigue.', 'Cesión: rebajaste 5% por 12 meses y la planta siguió; ese descuento sale de tu margen todo el año.'],
    ['Mantener la oferta', 'Mantienes los términos vigentes y la planta decide en 30 días si sigue.', 'Pasividad: no tocaste los términos y en 30 días la planta desvió parte de su consumo a otro proveedor.']],
  ['m04e', 'Impuesto verde', 'Entra un impuesto verde y los clientes revisan todos sus contratos de insumos.', 'Un nuevo impuesto verde encarece la energía de tus clientes industriales y todos revisan sus contratos de insumos para recortar costos. Algunos no tienen otro proveedor calificado.', 'Cliente: plantas industriales|Clientes que renegocian: 8|Sin otro proveedor calificado: 3',
    ['Contratos por valor', 'Propones contratos atados al ahorro que generas, no solo al volumen.', 'Equilibrada: contratos atados al ahorro que generas: el cliente paga por valor y tú proteges el margen.'],
    ['Precio a cautivos', 'Subes 6% el precio a los clientes que no tienen otro proveedor calificado.', 'Atajo: subiste 6% a los cautivos y el OI sube hoy; en cuanto califiquen a otro proveedor, se irán.'],
    ['Ofrecer rebaja', 'Ofreces 3% de rebaja a los clientes para fidelizarlos antes de que pidan.', 'Cesión: ofreciste 3% antes de que lo pidieran: fidelizaste, pero regalaste margen que no te exigían.'],
    ['Contestar pedidos', 'Contestas las peticiones de renegociar a medida que llegan de los clientes.', 'Pasividad: renegociaste a la defensiva, contrato por contrato, y los clientes impusieron sus precios.']],
  ['m04p', 'Rotación de operadores', 'Se van 2 de 9 operadores clave y los turnos quedan incompletos.', 'Dos de tus 9 operadores clave renunciaron para irse a la competencia y los turnos de la línea de dosificación quedan incompletos. Reemplazarlos toma meses de capacitación.', 'Cliente: plantas industriales|Operadores que se van: 2 de 9|Reemplazo: 6 semanas de práctica',
    ['Plan de relevo', 'Capacitas a dos jóvenes con 6 semanas de práctica y reorganizas los turnos.', 'Equilibrada: capacitaste a dos jóvenes y reordenaste turnos; cuesta hoy, pero se acaban las horas extra.'],
    ['Horas extra', 'Pides turnos dobles por un trimestre al equipo que queda.', 'Atajo: los turnos dobles sostienen la producción un trimestre; el equipo se desgasta y otros pueden irse.'],
    ['Subir sueldos', 'Subes 8% el sueldo de cada operador del turno y nadie más se va.', 'Cesión: el alza de 8% frenó las renuncias, pero el costo de mano de obra sube para siempre.'],
    ['Cupos vacantes', 'Reasignas tareas durante el trimestre y los 2 cupos siguen vacantes.', 'Pasividad: dejaste los cupos vacantes: bajó la nómina, pero la producción y la calidad se resintieron.']],
  ['m04s', 'Recorte de SG&A', 'Corporativo pide bajar 5% el SG&A desde el próximo mes.', 'Corporativo pide bajar 5% el SG&A desde el próximo mes para proteger el margen del grupo. Tu equipo ya viene justo y las visitas a clientes y la medición del valor dependen de ese presupuesto.', 'Cliente: plantas industriales|Recorte pedido: 5% del SG&A|Plazo: desde el próximo mes',
    ['Recorte selectivo', 'Recortas viajes y consultorías y proteges visitas a clientes y medición.', 'Equilibrada: recortaste viajes y consultorías y protegiste visitas y medición: menos SG&A, mismas ventas.'],
    ['Recorte parejo', 'Recortas cada partida 5% parejo para llegar a la meta de corporativo.', 'Atajo: recortaste todo 5% parejo: cumples la meta, pero también cortaste lo que sostiene las ventas.'],
    ['Pedir excepción', 'Pides una excepción con el argumento del plan comercial de este semestre.', 'Cesión: pediste una excepción y el SG&A no baja; corporativo anota que no cumpliste el recorte.'],
    ['Agendar revisión', 'Llevas la orden a la reunión de presupuesto de fin de trimestre.', 'Pasividad: llevaste la orden a la reunión de fin de trimestre y mientras tanto el SG&A siguió igual.']],
  ['m05c', 'Visitas sin costo', 'Una planta industrial (9% de tus ventas) pide visitas semanales sin pagar más.', 'Una planta industrial pide una visita técnica semanal para revisar calderas y torres de enfriamiento, sin pagar más. Cada visita cuesta horas de tu equipo y otras plantas podrían pedirla.', 'Cliente: planta industrial|Peso: 9% de tus ventas|Visitas pedidas: 4 por mes',
    ['Visita según dato', 'Instalas monitoreo remoto del agua y visitas solo si el dato lo pide.', 'Equilibrada: el monitoreo evita visitas de más: planta atendida y menos Direct Chg.'],
    ['Técnico nuevo', 'Aceptas las visitas semanales con un técnico nuevo y reduces el gasto 40%.', 'Atajo: un técnico nuevo cuesta 40% menos, pero una caldera mal dosificada pega fuerte después.'],
    ['Visitas semanales', 'Concedes 4 visitas por mes por cuenta tuya y pagas el costo del servicio.', 'Cesión: 4 visitas por mes a tu cuenta: planta contenta, y los Direct Chg suben sin ingreso a cambio.'],
    ['Pasar a Operaciones', 'Pasas la petición a Operaciones y ofreces respuesta con fecha en 20 días.', 'Pasividad: tardaste 20 días en contestar y la planta sintió que su agua no era prioridad.']],
  ['m05p', 'Incidente de seguridad', 'Hay una fuga sin heridos en la planta y la auditoría llega en 10 días.', 'Hay una fuga de producto en tu planta de tratamiento de agua: sin heridos, pero el procedimiento falló. En 10 días llega la auditoría de seguridad de un cliente industrial.', 'Cliente: plantas industriales|Auditoría: en 10 días|Pedidos en curso: 120',
    ['Investigar causa', 'Detienes el área 2 días con el equipo y corriges el procedimiento fallido.', 'Equilibrada: paraste el área 2 días y corregiste el procedimiento; la auditoría sale limpia.'],
    ['Cerrar el informe', 'Registras la fuga como incidente menor para no parar 7 días.', 'Línea roja: cerraste como menor una fuga real. Ocultarlo es grave: sanción y auditoría en contra.'],
    ['Parada total', 'Paras la planta 7 días y rehaces los procedimientos de seguridad desde cero.', 'Cesión: paraste 7 días y rehiciste los protocolos: seguridad impecable, pero con atrasos y costo alto.'],
    ['Producir igual', 'Cumples los 120 pedidos en curso, pues nadie resultó herido.', 'Pasividad: seguiste produciendo sin investigar: la auditoría industrial encuentra el procedimiento roto.']],
  ['m05s', 'Monitoreo remoto', 'Puedes invertir en monitoreo remoto para 6 plantas con visitas mensuales.', 'El monitoreo remoto reemplaza las visitas mensuales a 6 plantas clientes. El equipo es una inversión: se deprecia en años, pero la instalación y el servicio cuestan este año.', 'Cliente: 6 plantas industriales|Inversión total: US$ 0,8 M|Visitas hoy: 1 por mes',
    ['Invertir por etapas', 'Instalas en 2 plantas mayores y calculas el ahorro en visitas por 6 meses.', 'Equilibrada: instalaste en 2 plantas y mides el ahorro en visitas antes de comprometer las otras 4.'],
    ['Cancelar el plan', 'Cancelas la inversión para mejorar el margen del año y recortas visitas.', 'Atajo: cancelaste la inversión y recortaste visitas: el margen mejora hoy, pero el servicio se resiente.'],
    ['Instalar en las 6', 'Instalas el sistema en las 6 plantas con un presupuesto de 0,8.', 'Cesión: instalaste en las 6 sin probar; el costo pesa ahora y el ahorro es incierto.'],
    ['Decidir después', 'Evalúas el ahorro otros 3 meses mientras las visitas cuestan igual.', 'Pasividad: evaluaste 3 meses más y las visitas siguieron costando lo mismo; el ahorro se pospuso.']],
  ['m06c', 'Competidor 8% menor', 'Un competidor ofrece 8% menos y amenaza un contrato de 14% de ventas.', 'Un competidor ofrece 8% menos a un grupo industrial que pesa 14% de tus ventas. Su jefe de planta valora tu servicio, pero la gerencia presiona por bajar el costo del agua.', 'Cliente: grupo industrial|Peso: 14% de tus ventas|Oferta rival: 8% menos',
    ['Mostrar el ahorro', 'Reúnes el ahorro medido y defiendes el precio con un rebate durante 2 años.', 'Equilibrada: mostraste el ahorro medido en agua y energía y defendiste el precio con un rebate a 2 años.'],
    ['Amarrar al cliente', 'Firmas 3 años con multas de salida de 20% y conservas tu precio de lista.', 'Atajo: el contrato de 3 años con multas retiene al grupo hoy, pero atado y buscando salida.'],
    ['Igualar el precio', 'Bajas 8% el precio por todo el contrato y conservas el resto.', 'Cesión: igualaste el 8% menos todo el contrato: conservas al grupo y el margen se resiente cada mes.'],
    ['Confiar en el lazo', 'Cuidas la relación y das por seguro el apoyo de la planta por 3 años.', 'Pasividad: diste por segura su lealtad y el grupo pasó parte del contrato al competidor.']],
  ['m06p', 'Deriva de calidad', 'Esta semana 4 de 10 lotes de tratamiento salen al límite de la especificación.', 'Esta semana 4 de 10 lotes de tratamiento salen al límite de la especificación. Las plantas industriales exigen certificado de calidad por lote y un lote dudoso puede costar una auditoría.', 'Cliente: plantas industriales|Lotes al límite: 4 de 10|Certificado: por cada lote',
    ['Ajustar el proceso', 'Reajustas el proceso con calidad y endureces los controles de cada lote.', 'Equilibrada: ajustaste el proceso y reforzaste controles: lotes en rango y certificados reales para las plantas.'],
    ['Mezclar lotes', 'Mezclas lotes dudosos con lotes buenos para que el promedio pase.', 'Línea roja: mezclaste lotes dudosos con buenos para certificar. Es fraude de calidad: retiro y sanción.'],
    ['Controles extra', 'Duplicas las pruebas de cada lote y esperas 2 días para liberarlo.', 'Cesión: agregaste ensayos a cada lote y la liberación tarda 2 días más: calidad firme, con costo y atrasos.'],
    ['Esperar reclamos', 'Entregas los 4 lotes dudosos y esperas a ver si alguna planta se queja.', 'Pasividad: despachaste los 4 lotes sin reforzar nada: cuando una planta reclame, será por escrito.']],
  ['m07c', 'Auditoría de costos', 'Un cliente (11% de tus ventas) pide auditar tus costos y tu margen.', 'Una planta industrial que pesa 11% de tus ventas pide auditar tus costos y tu margen antes de renovar. Su comprador sospecha que el flete y el servicio vienen inflados.', 'Cliente: planta industrial|Peso: 11% de tus ventas|Pedido: auditar costos y margen',
    ['Abrir con reglas', 'Aceptas auditar y muestras flete y Direct Chg para acordar cómo comparar.', 'Equilibrada: abriste flete y Direct Chg con reglas claras; el cliente ve el valor y no pide más rebaja.'],
    ['Mostrar a medias', 'Muestras los costos que te favorecen con el resto en resumen.', 'Atajo: mostraste solo los costos que te favorecen; si el cliente cruza datos, pierdes su confianza.'],
    ['Libro abierto', 'Abres los costos por línea y aceptas bajar tu margen 2 puntos.', 'Cesión: abriste todo y aceptaste bajar 2 puntos de margen sin discutir el valor que entregas.'],
    ['Auditoría después', 'Postergas la auditoría por falta de tiempo, hasta 6 meses.', 'Pasividad: postergaste la auditoría 6 meses y el cliente asumió que escondías algo: compró menos.']],
  ['m07p', 'Proveedor atrasado', 'Tu único proveedor se atrasa 3 semanas con un insumo que pesa 30% del costo.', 'Tu único proveedor de un insumo que pesa 30% del costo avisa un atraso de 3 semanas. Una planta industrial espera tus pedidos y no acepta entregas incompletas.', 'Insumo: 30% del costo|Atraso: 3 semanas|Proveedores calificados: 1',
    ['Segundo proveedor', 'Calificas otro proveedor con 2 pruebas y cubres el hueco con existencias.', 'Equilibrada: calificaste otro proveedor y cubriste el hueco con existencias; dependes menos de uno.'],
    ['Insumo alternativo', 'Pasas 3 meses a un insumo más barato y avisas a la planta más tarde.', 'Atajo: el insumo barato salva el trimestre; en una caldera, cambiar sin avisar abre un reclamo.'],
    ['Traerlo en avión', 'Mandas el insumo por vía aérea al precio que sea para cubrir la semana.', 'Cesión: el avión salvó la fecha de la planta a cualquier tarifa, pero el flete se comió el margen.'],
    ['Plan único', 'Aceptas el atraso y esperas con las existencias actuales al proveedor único.', 'Pasividad: confiaste en el proveedor único y la planta paró 3 semanas: los pedidos industriales no salieron.']],
  ['m08c', 'Nuevo comprador', 'El nuevo gerente de compras de un cliente (16% de ventas) quiere licitar.', 'El nuevo gerente de compras de un grupo industrial (16% de tus ventas) quiere licitar todo el servicio de agua. Llegó con la meta de bajar costos y no conoce tu historial.', 'Cliente: grupo industrial|Peso: 16% de tus ventas|Proceso: licitación abierta',
    ['Reunión de valor', 'Reúnes resultados medidos y planteas un rebate escalonado durante 2 años.', 'Equilibrada: llevaste resultados en energía y paradas y un rebate escalonado: el gerente ve valor.'],
    ['Precio base bajo', 'Entras con un precio base 6% menor y cobras aparte el agua y la energía.', 'Atajo: entraste con 6% menos de precio base y cobraste aparte el servicio; la factura sorprende.'],
    ['Licitar al mínimo', 'Ofreces el precio más bajo posible para el servicio de 3 años.', 'Cesión: ofreciste el precio más bajo por 3 años: ganas todas las plantas con margen mínimo.'],
    ['Invitación formal', 'Recibes la invitación formal y ofreces cotizar en 10 días con tu tarifa actual.', 'Pasividad: esperaste la invitación formal y cotizaste en 10 días; el gerente ya manejaba otros precios.']],
  ['m08p', 'Capacidad al límite', 'La demanda supera 12% la capacidad de la planta por 3 meses.', 'En plena temporada de mayor consumo, las plantas industriales piden 12% más de lo que tu planta puede producir durante 3 meses. Producir más cuesta; rechazar pedidos también.', 'Cliente: plantas en alta demanda|Demanda sobre capacidad: +12%|Duración: 3 meses',
    ['Turno adicional', 'Abres un turno extra planificado y despachas primero lo de mayor margen.', 'Equilibrada: sumaste un turno planificado y priorizaste por margen y plazo: la planta rinde sin romperse.'],
    ['Planta sin pausa', 'Operas la línea sin descanso 3 meses y postergas las mantenciones.', 'Atajo: la planta sin pausa cubre la demanda, pero aplazar las mantenciones puede salir muy caro después.'],
    ['Tomar los pedidos', 'Tomas todos los pedidos y negocias las fechas cuando haya atrasos.', 'Cesión: aceptaste todos los pedidos y negociaste plazos después; atrasos y horas extra suben el costo.'],
    ['Mantener la rutina', 'No cambias el plan vigente y dejas que la demanda se ordene sola.', 'Pasividad: seguiste con el plan vigente y la demanda no se ordenó sola: las plantas buscaron a otro.']],
  ['m09c', 'Volumen por precio', 'Un grupo industrial (13% de ventas) promete 20% más volumen si le bajas 5%.', 'Un grupo industrial que pesa 13% de tus ventas promete 20% más volumen si le bajas 5%. Abre una planta nueva, pero la promesa no está firmada y su margen ya es bajo.', 'Cliente: grupo industrial|Volumen prometido: +20%|Rebaja pedida: 5%',
    ['Descuento por tramo', 'Rebajas 5% en el agua de la planta nueva y revisas el resultado a los 3 meses.', 'Equilibrada: rebajaste 5% solo en la planta nueva y revisaste a los 3 meses: más ventas, margen cuidado.'],
    ['Subir al resto', 'Subes 3% la lista a los talleres chicos, que no negocian, y costeas la rebaja.', 'Atajo: subiste 3% a los talleres chicos, que no negocian: hoy sube el OI, mañana lo notan.'],
    ['Dar el 5% a todo', 'Concedes 5% de descuento todo el año y confías en la planta nueva.', 'Cesión: diste 5% todo el año y confiaste en la promesa: más ventas, con un margen mucho menor.'],
    ['Pasar al comité', 'Esperas al comité de compras del grupo, que sesiona en 4 semanas.', 'Pasividad: dejaste la propuesta 4 semanas en el comité y el grupo repartió el volumen entre otros.']],
  ['m09p', 'Energía en horario punta', 'La tarifa eléctrica sube 12% en horario punta, donde la planta gasta 40%.', 'La tarifa eléctrica sube 12% en horario punta, justo cuando tu planta gasta 40% de su energía. Mover la producción tiene costo, y no hacer nada también.', 'Tarifa en horario punta: +12%|Gasto de energía en punta: 40%|Revisión de tarifa: en 3 meses',
    ['Mover la carga', 'Pasas 2 líneas de la planta al turno de noche y mantienes los pedidos.', 'Equilibrada: pasaste 2 líneas a la noche: la energía cuesta menos y mantienes los pedidos.'],
    ['Turno corto', 'Acortas el turno de tarde en un 25%, con lo que los pedidos chicos se atrasan.', 'Atajo: acortaste el turno de tarde 25%: ahorras energía, pero los pedidos chicos se atrasan.'],
    ['Cubrir el alza', 'Cubres el alza completa y mantienes los 3 turnos por no tocar la rutina.', 'Cesión: cubriste el alza completa por no tocar la rutina: el costo de energía sube todos los meses.'],
    ['Plan sin cambios', 'Sigues con los 3 turnos actuales y la tarifa se revisa dentro de 3 meses.', 'Pasividad: seguiste con 3 turnos hasta la revisión y pagaste el alza completa 3 meses sin mover nada.']],
  ['m10c', 'Equipos en comodato', 'Una planta pide 3 dosificadores en comodato para sus torres nuevas.', 'Una planta industrial pide 3 dosificadores en comodato para sus torres de enfriamiento nuevas. Los equipos son tuyos y su mantención corre por tu cuenta, aunque compre poco.', 'Equipos pedidos: 3 dosificadores|Compra mínima: sin acordar|Mantención: por tu cuenta',
    ['Comodato con mínimo', 'Cedes los equipos con compra mínima anual y la planta paga el servicio.', 'Equilibrada: prestaste los equipos con compra anual mínima y mantención pagada: instalas con retorno claro.'],
    ['Subir el precio', 'Recargas 3% al precio de los insumos del agua y costeas los equipos con eso.', 'Atajo: recargaste 3% a los insumos para pagar los equipos; la planta verá el alza en su factura.'],
    ['Entregar sin trabas', 'Instalas los 3 equipos sin condiciones y pagas tú la mantención.', 'Cesión: entregaste 3 equipos y asumiste la mantención aunque compre poco: Direct Chg sin ventas.'],
    ['Que los compre', 'Dices que el comodato no existe y que compre sus propios equipos.', 'Pasividad: le dijiste que comprara sus equipos; la planta se fue con quien sí los presta.']],
  ['m10p', 'Paro parcial', 'El sindicato anuncia 2 días de paro parcial si no hay bono de fin de año.', 'El sindicato de tu planta anuncia 2 días de paro parcial si no hay bono de fin de año. Los pedidos de las fiestas están en curso y una línea detenida atrasa a los clientes.', 'Paro anunciado: 2 días|Pedidos de fin de año: en curso|Bono exigido: fijo y anual',
    ['Bono por metas', 'Pagas un bono variable ligado a metas de planta y seguridad, en 2 cuotas.', 'Equilibrada: ofreciste un bono por metas de planta y seguridad en 2 cuotas: sin paro y con costo variable.'],
    ['Cubrir con extras', 'Cubres los 2 días con supervisores y evitas hablar con el sindicato.', 'Atajo: cubriste los 2 días con supervisores y evitaste hablar con el sindicato; el conflicto sigue abierto.'],
    ['Pagar el bono', 'Pagas el bono fijo que exigen y evitas el paro, aunque salga caro cada año.', 'Cesión: pagaste el bono fijo que exigían: sin paro, pero el costo de mano de obra sube cada año.'],
    ['Dejar que avance', 'Ignoras el anuncio y ves si el paro sigue adelante o se diluye.', 'Pasividad: ignoraste el anuncio y el paro ocurrió: esos 2 días no salieron pedidos.']],
  ['m11c', 'Cargos en disputa', 'Un cliente objeta 3% de cargos en 4 facturas, pero sigue comprando.', 'Una planta industrial objeta 3% de cargos en 4 facturas, pero sigue comprando. Cada cargo discutido es plata en suspenso y la discusión puede desgastar la relación.', 'Cargos en disputa: 3%|Facturas objetadas: 4|Cliente: planta industrial',

// Which units of business have a case written for each problem: the ones with a title in the Spanish dictionary (the parity test of the content

// The game as a state machine. A "run" is an immutable snapshot: every function returns a
// new run and never modifies the one it receives. The UI only reads run.phase and calls
// next / playCard / retry.
//
// Phases: floorIntro -> turn -> turnResult -> (turn ...) -> floorOutro -> [control] ->
//         floorIntro ... -> final.  Any move can end in 'dead'.

const { mulberry32, shuffle, nextSeed } = __r("rng");

const TURNS_PER_FLOOR = 3;
const HAND_SIZE = 4;
const MIN_OI = 10;
const GOAL_OI = 15;
const START_FLAGS = Object.freeze({ scanned: false, valueMeasured: false });

// The life bar is the OI margin: OI as a percentage of net sales.
const oiOf = (run) => operatingMargin(run.pl);
const isDead = (run) => oiOf(run) <= 0;

const die = (run) => ({ ...run, phase: 'dead', autopsy: buildAutopsy(run) });

const freshRun = (seed) => ({
  seed,
  phase: 'floorIntro',
  floorIdx: 0,
  turn: 0,
  pl: BASE_PL,
  flags: START_FLAGS,
  played: [],
  entries: [],
  deferred: [],
  hand: [],
  entry: null,
  last: null,
  room: null,
  checkpoint: null,
  attempt: 1,
});

// Applies bills deferred from earlier floors, then the floor's own shock.
function enterFloor(run, idx) {
  const floor = FLOORS[idx];
  const due = run.deferred.filter((d) => d.floorIdx === idx);
  const afterDeferred = due.reduce((pl, d) => applyOps(pl, d.ops), run.pl);
  const afterShock = applyOps(afterDeferred, floor.startOps);
  const entry = {
    floorIdx: idx,
    fromCards: due.map((d) => d.cardId),
    deferredOi: operatingMargin(afterDeferred) - operatingMargin(run.pl),
    shockOi: operatingMargin(afterShock) - operatingMargin(afterDeferred),
  };
  const next = {
    ...run,
    phase: 'floorIntro',
    floorIdx: idx,
    turn: 0,
    pl: afterShock,
    deferred: run.deferred.filter((d) => d.floorIdx !== idx),
    hand: [],
    entry,
    entries: [...run.entries, entry],
    last: null,
    room: null,
  };
  return isDead(next) ? die(next) : next;
}

// Without a seed the cards of every turn come in their authored positions (tests, balance);
// with one they are shuffled, so a second game does not repeat the first.
const newRun = (seed = null) => enterFloor(freshRun(seed), 0);

const isEligible = (card, run, playedIds) =>
  !playedIds.has(card.id) &&
  card.requires.every((flag) => run.flags[flag] === true) &&
  card.excludes.every((flag) => run.flags[flag] !== true);

// Cards change position (never the cards) with a seed derived from the run's, the floor, the
// turn and the attempt, so a retry deals them again in a new arrangement.
const dealSeed = (run) => nextSeed(run.seed + (run.floorIdx * TURNS_PER_FLOOR + run.turn) * 7919 + run.attempt * 104729);
const arrange = (run, hand) => (run.seed === null ? hand : shuffle(hand, mulberry32(dealSeed(run))));

// First four eligible cards from this turn's list, topped up from the floor's pool.
function buildHand(run) {

    .filter((id, i) => ordered.indexOf(id) === i)

function startTurn(run, turn) {

      return startTurn(run, 0);
    case 'turnResult':

        ? startTurn(run, run.turn + 1)
        : { ...run, phase: 'floorOutro' };
    case 'floorOutro':

    case 'control':
      return enterFloor(run, run.floorIdx + 1);

    last: entry,

      ...card.later.map((l) => ({ floorIdx: l.floor - 1, ops: l.ops, cardId })),

    played: [...run.played, entry],
  };

function retry(run) {
  const attempt = run.attempt + 1;
  if (run.checkpoint) return { ...run.checkpoint, checkpoint: run.checkpoint, attempt };
  return { ...newRun(run.seed), attempt };
}

  const value = oiOf(run);
